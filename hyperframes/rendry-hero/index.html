<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rendry Hero Demo</title>
  <style>
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
      font-weight: 300 800;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080B11; }
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #F8FAFC; }
    #rendry-hero {
      position: relative;
      width: 1280px;
      height: 816px;
      overflow: hidden;
      background: #080B11;
    }
    .ambient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 34%, rgba(74,108,247,.16), rgba(74,108,247,0) 58%);
    }
    .browser {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      overflow: hidden;
      background: #040609;
      box-shadow: 0 26px 70px rgba(0,0,0,.58), 0 0 48px rgba(74,108,247,.12);
    }
    .chrome {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      background: #0F131A;
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: relative;
      z-index: 20;
    }
    .traffic { position: absolute; left: 20px; display: flex; gap: 10px; }
    .traffic i { width: 13px; height: 13px; border-radius: 50%; display: block; }
    .traffic i:nth-child(1) { background: #FF5F56; }
    .traffic i:nth-child(2) { background: #FFBD2E; }
    .traffic i:nth-child(3) { background: #27C93F; }
    .address {
      width: 480px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 9px;
      color: #B6C1D2;
      background: rgba(255,255,255,.045);
      font-size: 17px;
    }
    .lock { width: 9px; height: 9px; border: 2px solid #94A3B8; border-radius: 2px; }
    .extension-icon {
      position: absolute;
      right: 22px;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(74,108,247,.14);
      border: 1px solid rgba(74,108,247,.35);
      color: #F8FAFC;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 0 18px rgba(74,108,247,.25);
    }
    .viewport { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; overflow: hidden; background: #080B11; }
    .page-strip { position: absolute; inset: 0; overflow: hidden; }
    .full-page {
      position: absolute;
      width: 100%;
      height: auto;
      left: 0;
      top: 0;
      display: block;
    }
    .popup {
      position: absolute;
      top: 78px;
      right: 40px;
      width: 355px;
      padding: 0 18px 18px;
      z-index: 30;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      background: #0F1624;
      box-shadow: 0 22px 60px rgba(0,0,0,.68);
    }
    .popup-head { display: flex; align-items: center; gap: 10px; height: 54px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 19px; font-weight: 800; }
    .popup-mark { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: #3553DB; font-size: 13px; }
    .pro { margin-left: auto; padding: 3px 8px; border-radius: 6px; background: #3553DB; font-size: 12px; letter-spacing: .08em; }
    .formats { margin-top: 16px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px; border: 1px solid rgba(255,255,255,.06); border-radius: 9px; background: rgba(255,255,255,.035); }
    .formats span { padding: 8px 0; text-align: center; color: #AAB5C7; font-size: 15px; font-weight: 700; }
    .formats span:first-child { color: #F8FAFC; background: #3553DB; border-radius: 6px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 2px; color: #F8FAFC; font-size: 16px; }
    .toggle { width: 42px; height: 24px; padding: 3px; display: flex; justify-content: flex-end; border-radius: 20px; background: #10B981; }
    .toggle i { display: block; width: 18px; height: 18px; background: #F8FAFC; border-radius: 50%; }
    .capture-button { width: 100%; height: 48px; border: 0; border-radius: 10px; color: #F8FAFC; background: #3553DB; font: 800 17px "Plus Jakarta Sans"; box-shadow: 0 8px 24px rgba(74,108,247,.32); }
    .scan-line { position: absolute; left: 24px; right: 24px; top: 82px; height: 4px; z-index: 26; opacity: 0; background: #4A6CF7; box-shadow: 0 0 22px #4A6CF7; }
    .capture-status { position: absolute; left: 34px; bottom: 28px; z-index: 25; opacity: 0; display: flex; align-items: center; gap: 10px; padding: 10px 15px; border: 1px solid rgba(74,108,247,.35); border-radius: 999px; background: rgba(15,22,36,.94); color: #DCE4FF; font-size: 17px; font-weight: 700; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: #4A6CF7; box-shadow: 0 0 12px #4A6CF7; }
    .segments { position: absolute; right: 30px; bottom: 26px; width: 130px; height: 160px; z-index: 25; opacity: 0; }
    .segment { position: absolute; right: 0; width: 98px; height: 70px; overflow: hidden; border: 2px solid #F8FAFC; border-radius: 6px; background: #F8FAFC; box-shadow: 0 10px 26px rgba(0,0,0,.5); }
    .segment { background-image: url("capture/screenshots/full-page.png"); background-size: cover; background-position: top center; }
    .segment:nth-child(1) { top: 0; }
    .segment:nth-child(2) { top: 38px; right: 12px; }
    .segment:nth-child(3) { top: 76px; right: 24px; }
    .stitch-label { position: absolute; bottom: 0; right: 0; padding: 6px 10px; border-radius: 7px; background: #10B981; color: #F8FAFC; font-size: 14px; font-weight: 800; white-space: nowrap; opacity: 0; }
    .editor { position: absolute; inset: 58px 0 0; z-index: 40; opacity: 0; background: #040609; }
    .toolbar { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,.08); background: #0F131A; }
    .tools, .actions { display: flex; align-items: center; gap: 8px; }
    .tool { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #B4BECE; border: 1px solid rgba(255,255,255,.04); }
    .tool svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tool.active { color: #F8FAFC; background: #3553DB; }
    .divider { width: 1px; height: 24px; background: rgba(255,255,255,.1); margin: 0 4px; }
    .actions { color: #B4BECE; font-size: 16px; }
    .copy { padding: 9px 16px; border-radius: 8px; background: #3553DB; color: #F8FAFC; font-weight: 800; }
    .workspace { position: absolute; inset: 58px 0 0; display: flex; align-items: center; justify-content: center; background: #080B11; }
    .stitched {
      position: relative;
      width: 790px;
      height: 610px;
      overflow: hidden;
      border-radius: 9px;
      background: #FFFFFF;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 28px 65px rgba(0,0,0,.58);
    }
    .stitched { background-image: url("capture/screenshots/full-page.png"); background-size: 100% auto; background-position: top center; background-repeat: no-repeat; }
    /* The screenshot and every redaction share this 1920×2185 source plane.
       SVG scales with the image, so a responsive preview cannot drift the masks. */
    .redaction-layer { position: absolute; top: 0; left: 0; width: 100%; height: auto; z-index: 2; pointer-events: none; }
    .redaction-pixels { opacity: 0; }
    .detection-outline { fill: none; stroke: #4A6CF7; stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0; }
    .redact-chip { position: absolute; left: 24px; bottom: 24px; opacity: 0; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 999px; color: #F8FAFC; background: #0F1624; border: 1px solid rgba(16,185,129,.45); box-shadow: 0 12px 28px rgba(0,0,0,.38); font-size: 17px; font-weight: 800; }
    .redact-chip i { width: 10px; height: 10px; display: block; border-radius: 50%; background: #10B981; box-shadow: 0 0 10px #10B981; }
    .selection-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .selection-svg rect { fill: rgba(239,68,68,.045); stroke: #EF4444; stroke-width: 4; stroke-dasharray: 1430; stroke-dashoffset: 1430; }
    .cursor { position: absolute; z-index: 80; width: 26px; height: 32px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.58)); }
    .cursor::before { content: ""; position: absolute; width: 21px; height: 27px; background: #F8FAFC; clip-path: polygon(0 0, 80% 68%, 51% 70%, 67% 100%, 52% 100%, 37% 72%, 16% 91%); }
    .cursor::after { content: ""; position: absolute; left: 0; top: 0; width: 21px; height: 27px; clip-path: polygon(0 0, 80% 68%, 51% 70%, 67% 100%, 52% 100%, 37% 72%, 16% 91%); box-shadow: inset 0 0 0 2px #040609; }
    .click-ring { position: absolute; z-index: 79; width: 24px; height: 24px; opacity: 0; border-radius: 50%; border: 3px solid #4A6CF7; }
    .loop-cover { position: absolute; inset: 0; z-index: 100; pointer-events: none; opacity: 0; background: #080B11; }
  </style>
</head>
